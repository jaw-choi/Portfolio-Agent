<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Personal Career Knowledge Agent</title>
<style>
  :root {
    --bg: #f7f7f8;
    --panel: #ffffff;
    --border: #e3e3e6;
    --text: #1f1f1f;
    --muted: #6b6b70;
    --accent: #2f6feb;
    --user-bubble: #2f6feb;
    --user-text: #ffffff;
    --agent-bubble: #ffffff;
    --error-bubble: #fdecea;
    --error-text: #8a1c1c;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #17181c;
      --panel: #202127;
      --border: #34353c;
      --text: #eaeaec;
      --muted: #9a9aa2;
      --accent: #5b8dfd;
      --user-bubble: #5b8dfd;
      --user-text: #0e0e10;
      --agent-bubble: #2a2b32;
      --error-bubble: #3a2323;
      --error-text: #ff9b9b;
    }
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, "Segoe UI", "Malgun Gothic", system-ui, sans-serif;
  }
  #app {
    max-width: 720px;
    margin: 0 auto;
    height: 100%;
    display: flex;
    flex-direction: column;
  }
  header {
    padding: 16px 20px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  header h1 {
    font-size: 16px;
    margin: 0;
  }
  header p {
    margin: 2px 0 0;
    font-size: 12px;
    color: var(--muted);
  }
  #new-chat {
    border: 1px solid var(--border);
    background: var(--panel);
    color: var(--text);
    border-radius: 8px;
    padding: 6px 12px;
    font-size: 13px;
    cursor: pointer;
  }
  #new-chat:hover { border-color: var(--accent); }

  #messages {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .empty-hint {
    margin: auto;
    text-align: center;
    color: var(--muted);
    font-size: 14px;
    max-width: 320px;
    line-height: 1.6;
  }
  .row { display: flex; }
  .row.user { justify-content: flex-end; }
  .row.agent, .row.error { justify-content: flex-start; }

  .bubble {
    max-width: 78%;
    padding: 10px 14px;
    border-radius: 14px;
    line-height: 1.5;
    font-size: 14px;
    white-space: pre-wrap;
    word-break: break-word;
  }
  .row.user .bubble {
    background: var(--user-bubble);
    color: var(--user-text);
    border-bottom-right-radius: 4px;
  }
  .row.agent .bubble {
    background: var(--agent-bubble);
    border: 1px solid var(--border);
    border-bottom-left-radius: 4px;
  }
  .row.error .bubble {
    background: var(--error-bubble);
    color: var(--error-text);
    border-bottom-left-radius: 4px;
  }
  .sources {
    margin-top: 8px;
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }
  .source-chip {
    font-size: 11px;
    padding: 3px 8px;
    border-radius: 999px;
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--muted);
    text-decoration: none;
  }
  .source-chip:hover { border-color: var(--accent); color: var(--accent); }

  .reason {
    margin-top: 6px;
    font-size: 12px;
    color: var(--muted);
  }

  .typing {
    display: inline-flex;
    gap: 4px;
    padding: 4px 0;
  }
  .typing span {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--muted);
    animation: bounce 1.2s infinite ease-in-out;
  }
  .typing span:nth-child(2) { animation-delay: 0.15s; }
  .typing span:nth-child(3) { animation-delay: 0.3s; }
  @keyframes bounce {
    0%, 80%, 100% { transform: translateY(0); opacity: 0.4; }
    40% { transform: translateY(-4px); opacity: 1; }
  }

  form#composer {
    display: flex;
    gap: 8px;
    padding: 14px 20px;
    border-top: 1px solid var(--border);
    background: var(--panel);
  }
  #message-input {
    flex: 1;
    resize: none;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--text);
    border-radius: 10px;
    padding: 10px 12px;
    font-size: 14px;
    font-family: inherit;
    max-height: 120px;
  }
  #message-input:focus { outline: none; border-color: var(--accent); }
  #send-btn {
    border: none;
    background: var(--accent);
    color: white;
    border-radius: 10px;
    padding: 0 18px;
    font-size: 14px;
    cursor: pointer;
  }
  #send-btn:disabled { opacity: 0.5; cursor: not-allowed; }
</style>
</head>
<body>
<div id="app">
  <header>
    <div>
      <h1>Personal Career Knowledge Agent</h1>
      <p>Obsidian · 블로그 · 포트폴리오 · GitHub 기반 개인 지식 RAG</p>
    </div>
    <button id="new-chat" type="button">새 대화</button>
  </header>

  <div id="messages">
    <div class="empty-hint" id="empty-hint">
      쌓아온 노트, 블로그, 포트폴리오, GitHub 내용에 대해 질문해보세요.<br>
      예: "싱글톤 패턴이 뭐야?", "HarvestLeague 프로젝트가 뭐야?"
    </div>
  </div>

  <form id="composer">
    <textarea id="message-input" rows="1" placeholder="질문을 입력하세요..." autofocus></textarea>
    <button id="send-btn" type="submit">전송</button>
  </form>
</div>

<script>
  const messagesEl = document.getElementById('messages');
  const emptyHint = document.getElementById('empty-hint');
  const form = document.getElementById('composer');
  const input = document.getElementById('message-input');
  const sendBtn = document.getElementById('send-btn');
  const newChatBtn = document.getElementById('new-chat');

  let conversationId = null;

  function scrollToBottom() {
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  function addRow(kind, buildContent) {
    if (emptyHint) emptyHint.remove();
    const row = document.createElement('div');
    row.className = 'row ' + kind;
    const bubble = document.createElement('div');
    bubble.className = 'bubble';
    buildContent(bubble);
    row.appendChild(bubble);
    messagesEl.appendChild(row);
    scrollToBottom();
    return row;
  }

  function addUserMessage(text) {
    addRow('user', (bubble) => { bubble.textContent = text; });
  }

  function addTypingIndicator() {
    return addRow('agent', (bubble) => {
      bubble.innerHTML = '<span class="typing"><span></span><span></span><span></span></span>';
    });
  }

  function addAgentMessage(data) {
    addRow('agent', (bubble) => {
      const answer = document.createElement('div');
      answer.textContent = data.answer;
      bubble.appendChild(answer);

      if (data.reason) {
        const reason = document.createElement('div');
        reason.className = 'reason';
        reason.textContent = data.reason;
        bubble.appendChild(reason);
      }

      if (data.sources && data.sources.length > 0) {
        const sources = document.createElement('div');
        sources.className = 'sources';
        data.sources.forEach((s) => {
          const label = s.filename || s.source_url || '출처';
          if (s.source_url) {
            const a = document.createElement('a');
            a.className = 'source-chip';
            a.href = s.source_url;
            a.target = '_blank';
            a.rel = 'noopener noreferrer';
            a.textContent = label;
            sources.appendChild(a);
          } else {
            const span = document.createElement('span');
            span.className = 'source-chip';
            span.textContent = label;
            sources.appendChild(span);
          }
        });
        bubble.appendChild(sources);
      }
    });
  }

  function addErrorMessage(text) {
    addRow('error', (bubble) => { bubble.textContent = text; });
  }

  async function sendMessage(message) {
    addUserMessage(message);
    const typingRow = addTypingIndicator();
    sendBtn.disabled = true;
    input.disabled = true;

    try {
      const res = await fetch('/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message, conversation_id: conversationId }),
      });
      const data = await res.json();
      typingRow.remove();

      if (!res.ok) {
        addErrorMessage(data.detail || `요청이 실패했습니다 (${res.status})`);
        return;
      }

      conversationId = data.conversation_id;
      addAgentMessage(data);
    } catch (err) {
      typingRow.remove();
      addErrorMessage('서버에 연결할 수 없습니다: ' + err.message);
    } finally {
      sendBtn.disabled = false;
      input.disabled = false;
      input.focus();
    }
  }

  form.addEventListener('submit', (e) => {
    e.preventDefault();
    const message = input.value.trim();
    if (!message) return;
    input.value = '';
    input.style.height = 'auto';
    sendMessage(message);
  });

  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      form.requestSubmit();
    }
  });

  input.addEventListener('input', () => {
    input.style.height = 'auto';
    input.style.height = Math.min(input.scrollHeight, 120) + 'px';
  });

  newChatBtn.addEventListener('click', () => {
    conversationId = null;
    messagesEl.innerHTML = '';
    messagesEl.appendChild(emptyHint);
    input.focus();
  });
</script>
</body>
</html>
