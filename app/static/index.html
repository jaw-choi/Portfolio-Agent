<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Personal Career Knowledge Agent</title>
<style>
  :root {
    --bg: #f7f7f8;
    --panel: #ffffff;
    --border: #e3e3e6;
    --text: #1f1f1f;
    --muted: #6b6b70;
    --accent: #2f6feb;
    --user-bubble: #2f6feb;
    --user-text: #ffffff;
    --agent-bubble: #ffffff;
    --error-bubble: #fdecea;
    --error-text: #8a1c1c;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #17181c;
      --panel: #202127;
      --border: #34353c;
      --text: #eaeaec;
      --muted: #9a9aa2;
      --accent: #5b8dfd;
      --user-bubble: #5b8dfd;
      --user-text: #0e0e10;
      --agent-bubble: #2a2b32;
      --error-bubble: #3a2323;
      --error-text: #ff9b9b;
    }
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, "Segoe UI", "Malgun Gothic", system-ui, sans-serif;
  }
  #app {
    max-width: 720px;
    margin: 0 auto;
    height: 100%;
    display: flex;
    flex-direction: column;
  }
  header {
    padding: 16px 20px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  header h1 {
    font-size: 16px;
    margin: 0;
  }
  header p {
    margin: 2px 0 0;
    font-size: 12px;
    color: var(--muted);
  }
  #new-chat {
    border: 1px solid var(--border);
    background: var(--panel);
    color: var(--text);
    border-radius: 8px;
    padding: 6px 12px;
    font-size: 13px;
    cursor: pointer;
  }
  #new-chat:hover { border-color: var(--accent); }

  .header-right {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  #mode-toggle {
    display: inline-flex;
    border: 1px solid var(--border);
    border-radius: 8px;
    overflow: hidden;
  }
  #mode-toggle button {
    border: none;
    background: var(--panel);
    color: var(--muted);
    padding: 6px 12px;
    font-size: 13px;
    cursor: pointer;
  }
  #mode-toggle button + button { border-left: 1px solid var(--border); }
  #mode-toggle button.active {
    background: var(--accent);
    color: white;
  }
  #mode-note {
    margin: 6px 20px 0;
    font-size: 12px;
    color: var(--muted);
  }

  #messages {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .empty-hint {
    margin: auto;
    text-align: center;
    color: var(--muted);
    font-size: 14px;
    max-width: 320px;
    line-height: 1.6;
  }
  .row { display: flex; }
  .row.user { justify-content: flex-end; }
  .row.agent, .row.error { justify-content: flex-start; }

  .bubble {
    max-width: 78%;
    padding: 10px 14px;
    border-radius: 14px;
    line-height: 1.5;
    font-size: 14px;
    white-space: pre-wrap;
    word-break: break-word;
  }
  .row.user .bubble {
    background: var(--user-bubble);
    color: var(--user-text);
    border-bottom-right-radius: 4px;
  }
  .row.agent .bubble {
    background: var(--agent-bubble);
    border: 1px solid var(--border);
    border-bottom-left-radius: 4px;
  }
  .row.error .bubble {
    background: var(--error-bubble);
    color: var(--error-text);
    border-bottom-left-radius: 4px;
  }
  .sources {
    margin-top: 8px;
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }
  .source-chip {
    font-size: 11px;
    padding: 3px 8px;
    border-radius: 999px;
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--muted);
    text-decoration: none;
  }
  .source-chip:hover { border-color: var(--accent); color: var(--accent); }

  .reason {
    margin-top: 6px;
    font-size: 12px;
    color: var(--muted);
  }

  .results {
    display: flex;
    flex-direction: column;
    gap: 10px;
    max-width: 90%;
    width: 100%;
  }
  .result-card {
    background: var(--agent-bubble);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 10px 14px;
    font-size: 13px;
  }
  .result-card-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    margin-bottom: 6px;
  }
  .result-title {
    font-weight: 600;
    font-size: 13px;
  }
  .result-title a { color: inherit; }
  .result-score {
    font-size: 11px;
    color: var(--muted);
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 2px 8px;
    white-space: nowrap;
  }
  .result-text {
    color: var(--muted);
    line-height: 1.5;
    max-height: 4.5em;
    overflow: hidden;
  }

  .typing {
    display: inline-flex;
    gap: 4px;
    padding: 4px 0;
  }
  .typing span {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--muted);
    animation: bounce 1.2s infinite ease-in-out;
  }
  .typing span:nth-child(2) { animation-delay: 0.15s; }
  .typing span:nth-child(3) { animation-delay: 0.3s; }
  @keyframes bounce {
    0%, 80%, 100% { transform: translateY(0); opacity: 0.4; }
    40% { transform: translateY(-4px); opacity: 1; }
  }

  form#composer {
    display: flex;
    gap: 8px;
    padding: 14px 20px;
    border-top: 1px solid var(--border);
    background: var(--panel);
  }
  #message-input {
    flex: 1;
    resize: none;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--text);
    border-radius: 10px;
    padding: 10px 12px;
    font-size: 14px;
    font-family: inherit;
    max-height: 120px;
  }
  #message-input:focus { outline: none; border-color: var(--accent); }
  #send-btn {
    border: none;
    background: var(--accent);
    color: white;
    border-radius: 10px;
    padding: 0 18px;
    font-size: 14px;
    cursor: pointer;
  }
  #send-btn:disabled { opacity: 0.5; cursor: not-allowed; }
</style>
</head>
<body>
<div id="app">
  <header>
    <div>
      <h1>Personal Career Knowledge Agent</h1>
      <p>Obsidian · 블로그 · 포트폴리오 · GitHub 기반 개인 지식 RAG</p>
    </div>
    <div class="header-right">
      <div id="mode-toggle">
        <button type="button" data-mode="search" class="active">🔍 검색</button>
        <button type="button" data-mode="chat">💬 채팅</button>
      </div>
      <button id="new-chat" type="button">새 대화</button>
    </div>
  </header>
  <div id="mode-note">검색 모드는 API 키 없이 바로 됩니다. 채팅 모드는 답변 문장을 생성하려면 서버에 API 키가 설정되어 있어야 합니다.</div>

  <div id="messages">
    <div class="empty-hint" id="empty-hint">
      쌓아온 노트, 블로그, 포트폴리오, GitHub 내용에 대해 질문해보세요.<br>
      예: "싱글톤 패턴이 뭐야?", "HarvestLeague 프로젝트가 뭐야?"
    </div>
  </div>

  <form id="composer">
    <textarea id="message-input" rows="1" placeholder="검색어를 입력하세요..." autofocus></textarea>
    <button id="send-btn" type="submit">검색</button>
  </form>
</div>

<script>
  const messagesEl = document.getElementById('messages');
  const emptyHint = document.getElementById('empty-hint');
  const form = document.getElementById('composer');
  const input = document.getElementById('message-input');
  const sendBtn = document.getElementById('send-btn');
  const newChatBtn = document.getElementById('new-chat');
  const modeButtons = document.querySelectorAll('#mode-toggle button');

  let conversationId = null;
  let mode = 'search';

  function applyModePlaceholders() {
    if (mode === 'search') {
      input.placeholder = '검색어를 입력하세요...';
      sendBtn.textContent = '검색';
    } else {
      input.placeholder = '질문을 입력하세요...';
      sendBtn.textContent = '전송';
    }
  }

  modeButtons.forEach((btn) => {
    btn.addEventListener('click', () => {
      mode = btn.dataset.mode;
      modeButtons.forEach((b) => b.classList.toggle('active', b === btn));
      applyModePlaceholders();
      input.focus();
    });
  });
  applyModePlaceholders();

  function scrollToBottom() {
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  function addRow(kind, buildContent) {
    if (emptyHint) emptyHint.remove();
    const row = document.createElement('div');
    row.className = 'row ' + kind;
    const bubble = document.createElement('div');
    bubble.className = 'bubble';
    buildContent(bubble);
    row.appendChild(bubble);
    messagesEl.appendChild(row);
    scrollToBottom();
    return row;
  }

  function addUserMessage(text) {
    addRow('user', (bubble) => { bubble.textContent = text; });
  }

  function documentLink(source) {
    if (source.source_url) return source.source_url;
    return '/documents/' + encodeURIComponent(source.document_id) + '/content';
  }

  function addTypingIndicator() {
    return addRow('agent', (bubble) => {
      bubble.innerHTML = '<span class="typing"><span></span><span></span><span></span></span>';
    });
  }

  function addAgentMessage(data) {
    addRow('agent', (bubble) => {
      const answer = document.createElement('div');
      answer.textContent = data.answer;
      bubble.appendChild(answer);

      if (data.reason) {
        const reason = document.createElement('div');
        reason.className = 'reason';
        reason.textContent = data.reason;
        bubble.appendChild(reason);
      }

      if (data.sources && data.sources.length > 0) {
        const sources = document.createElement('div');
        sources.className = 'sources';
        data.sources.forEach((s) => {
          const label = s.filename || s.source_url || '출처';
          const a = document.createElement('a');
          a.className = 'source-chip';
          a.href = documentLink(s);
          a.target = '_blank';
          a.rel = 'noopener noreferrer';
          a.textContent = label;
          sources.appendChild(a);
        });
        bubble.appendChild(sources);
      }
    });
  }

  function addErrorMessage(text) {
    addRow('error', (bubble) => { bubble.textContent = text; });
  }

  function addSearchResults(results) {
    if (emptyHint) emptyHint.remove();
    const row = document.createElement('div');
    row.className = 'row agent';
    const wrap = document.createElement('div');
    wrap.className = 'results';

    if (results.length === 0) {
      const empty = document.createElement('div');
      empty.className = 'bubble';
      empty.textContent = '관련된 내용을 찾지 못했습니다.';
      wrap.appendChild(empty);
    }

    results.forEach((r) => {
      const card = document.createElement('div');
      card.className = 'result-card';

      const header = document.createElement('div');
      header.className = 'result-card-header';

      const title = document.createElement('div');
      title.className = 'result-title';
      const label = r.filename || r.source_url || r.document_id;
      const a = document.createElement('a');
      a.href = documentLink(r);
      a.target = '_blank';
      a.rel = 'noopener noreferrer';
      a.textContent = label;
      title.appendChild(a);
      header.appendChild(title);

      const score = document.createElement('span');
      score.className = 'result-score';
      score.textContent = '유사도 ' + Math.round(r.similarity * 100) + '%';
      header.appendChild(score);

      const text = document.createElement('div');
      text.className = 'result-text';
      text.textContent = r.text;

      card.appendChild(header);
      card.appendChild(text);
      wrap.appendChild(card);
    });

    row.appendChild(wrap);
    messagesEl.appendChild(row);
    scrollToBottom();
  }

  async function sendChat(message) {
    const res = await fetch('/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message, conversation_id: conversationId }),
    });
    const data = await res.json();
    if (!res.ok) {
      addErrorMessage(data.detail || `요청이 실패했습니다 (${res.status})`);
      return;
    }
    conversationId = data.conversation_id;
    addAgentMessage(data);
  }

  async function sendSearch(query) {
    const res = await fetch('/search', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ query, top_k: 5 }),
    });
    const data = await res.json();
    if (!res.ok) {
      addErrorMessage(data.detail || `요청이 실패했습니다 (${res.status})`);
      return;
    }
    addSearchResults(data.results);
  }

  async function sendMessage(message) {
    addUserMessage(message);
    const typingRow = addTypingIndicator();
    sendBtn.disabled = true;
    input.disabled = true;

    try {
      if (mode === 'search') {
        await sendSearch(message);
      } else {
        await sendChat(message);
      }
    } catch (err) {
      addErrorMessage('서버에 연결할 수 없습니다: ' + err.message);
    } finally {
      typingRow.remove();
      sendBtn.disabled = false;
      input.disabled = false;
      input.focus();
    }
  }

  form.addEventListener('submit', (e) => {
    e.preventDefault();
    const message = input.value.trim();
    if (!message) return;
    input.value = '';
    input.style.height = 'auto';
    sendMessage(message);
  });

  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      form.requestSubmit();
    }
  });

  input.addEventListener('input', () => {
    input.style.height = 'auto';
    input.style.height = Math.min(input.scrollHeight, 120) + 'px';
  });

  newChatBtn.addEventListener('click', () => {
    conversationId = null;
    messagesEl.innerHTML = '';
    messagesEl.appendChild(emptyHint);
    input.focus();
  });
</script>
</body>
</html>
