services:
  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-career_agent}:${POSTGRES_PASSWORD:-career_agent}@db:5432/${POSTGRES_DB:-career_agent}
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - hf_cache:/app/.cache/huggingface
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-career_agent}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-career_agent}
      POSTGRES_DB: ${POSTGRES_DB:-career_agent}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-career_agent}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  db_data:
  hf_cache:
